# /etc/rsyslog.d/10-remote.conf
# リモート機器からのログを送信元IPごと・日ごとのファイルに分けて保存する。
# 50-default.conf より先に読ませ、/var/log/syslog には混ぜない（stop）。

# 受信時刻(サーバー時刻, UTC) / 送信元IP / 名乗ったホスト名 / 機器側の時刻 / タグ+本文
template(name="RemoteFmt" type="string"
  string="%timegenerated:::date-rfc3339% %fromhost-ip% %hostname% devtime=%timereported:::date-rfc3339% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

# ホスト名は送信元が自由に名乗れるので、ディレクトリ名には fromhost-ip を使う
template(name="RemoteFile" type="string"
  string="/var/log/remote/%fromhost-ip%/%$year%-%$month%-%$day%.log")
# 利用者追跡用（NAPT / NAT64(Jool) / NDP / DHCP）
template(name="RemoteTraceFile" type="string"
  string="/var/log/remote/%fromhost-ip%/trace-%$year%-%$month%-%$day%T%$hour%.log")

template(name="RemoteDnsFile" type="string"
  string="/var/log/remote/%fromhost-ip%/dns-%$year%-%$month%-%$day%T%$hour%.log")

if ($inputname == "imudp" or $inputname == "imtcp") then {
  # DNS クエリログ（件数が多いので 1時間ごと）
  if ($programname == "unbound") then {
    action(type="omfile" dynaFile="RemoteDnsFile" template="RemoteFmt"
           dirCreateMode="0750" dirGroup="adm" fileCreateMode="0640" fileGroup="adm"
           dynaFileCacheSize="200" closeTimeout="5")
    stop
  }
  if ($programname == "napt44-log" or $programname == "ndp-log"
      or ($programname == "kernel" and $msg contains "Jool:")
      or $programname == "dhcpd" or $programname == "kea-dhcp4"
      or $programname == "dnsmasq-dhcp"
      or $msg contains "DHCPACK" or $msg contains "DHCPRELEASE") then {
    action(type="omfile" dynaFile="RemoteTraceFile" template="RemoteFmt"
           dirCreateMode="0750" dirGroup="adm" fileCreateMode="0640" fileGroup="adm"
           dynaFileCacheSize="200" closeTimeout="5")
    stop
  }
  action(type="omfile" dynaFile="RemoteFile" template="RemoteFmt"
         dirCreateMode="0750" dirGroup="adm" fileCreateMode="0640" fileGroup="adm"
         dynaFileCacheSize="200" closeTimeout="5")
  stop
}
