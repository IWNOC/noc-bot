# noc-bot configuration: only where things are. Everything about the site (teams, who to mention,
# what devices are, known issues) starts empty and is learned in Slack, confirmed by people.
listen:
  tcp: ":6514"     # rsyslog forwards event lines here (deploy/rsyslog-forward.conf)
  http: ":8080"    # /health and /v1/teacher (laya-svc's Escalator calls it)

laya:
  url: "http://laya-svc:8100"
  token_env: LAYA_SVC_TOKEN
  live_desks: [line]   # laya answers alone where it has earned trust; other desks stay in shadow

llm:
  url: "https://llm.example/v1"
  model: "Qwen3.8-Flash-Next-oQ4e-fp16-mtp"      # fast: labels, notes
  agent_model: "Qwen3.8-Flash-Next-oQ4e-fp16-mtp" # Slack conversation and alert writing
  token_env: LLM_TOKEN

slack:
  channel: ""   # channel id; tokens: SLACK_BOT_TOKEN, SLACK_APP_TOKEN

web:
  searx_url: "http://127.0.0.1:8888"   # local SearXNG for web_search; empty disables web tools

store:
  path: /data/noc-bot.db
