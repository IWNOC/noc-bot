#!/usr/sbin/nft -f
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    meta l4proto { icmp, ipv6-icmp } accept
    tcp dport 22 ip saddr { 10.20.0.0/20, 10.110.0.0/16 } accept     # ssh from mgmt / server LANs
    iifname "tailscale0" tcp dport 22 accept
    tcp dport 6514 ip saddr 10.110.51.4 accept                         # rsyslog forward
    iifname "tailscale0" tcp dport 8080 accept                         # /v1/teacher from laya-svc, /health
    tcp dport 8080 ip saddr 10.20.4.0/24 accept                        # health checks from mgmt (Zabbix)
    udp dport 41641 accept                                             # tailscale direct connections
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output { type filter hook output priority 0; policy accept; }
}
