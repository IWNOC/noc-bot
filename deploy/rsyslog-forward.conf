# /etc/rsyslog.d/05-noc-bot.conf on the syslog server (10.110.51.4).
# The name must sort BEFORE 10-remote.conf: that file ends with "stop", so later files never see remote lines.
# Sends a copy of the device/service event lines to noc-bot. The trace data (NAT/NDP/DHCP packets)
# and DNS query logs are not forwarded: noc-bot only needs their counts, which come later via noc-query.
#
# The queue is in memory and DISCARDS when full, so a slow or dead noc-bot can never block or slow
# down log storage.
# Own copy of 10-remote.conf's RemoteFmt: this file is read first, so it cannot use that template.
template(name="NocBotFmt" type="string"
  string="%timegenerated:::date-rfc3339% %fromhost-ip% %hostname% devtime=%timereported:::date-rfc3339% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

if ($inputname == "imudp" or $inputname == "imtcp")
   and not ($programname == "napt44-log" or $programname == "ndp-log"
            or ($programname == "kernel" and $msg contains "Jool:")
            or $programname == "unbound"
            or ($programname == "kea-dhcp4" and $msg contains " INFO ")
            or $fromhost-ip == "127.0.0.1") then {
  action(type="omfwd" target="NOC_BOT_HOST" port="6514" protocol="tcp"
         template="NocBotFmt"
         queue.type="LinkedList" queue.size="50000" queue.discardMark="45000" queue.discardSeverity="8"
         queue.timeoutEnqueue="0" action.resumeRetryCount="-1" action.resumeInterval="10")
}
