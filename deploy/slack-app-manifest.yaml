# Slack app manifest for noc-bot.
# Slack → https://api.slack.com/apps → Create New App → From a manifest → paste this.
# Socket Mode: noc-bot connects out to Slack, so nothing has to be reachable from the internet.
display_information:
  name: noc-bot
  description: Watches the event network's logs, alerts, and learns from your answers.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: noc-bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read   # "@noc-bot ..." requests (team setup, questions)
      - chat:write          # alerts, threads, confirmation cards
      - channels:history    # replies in incident threads (public channels)
      - groups:history      # same for private channels
      - reactions:read      # emoji answers on alerts
      - usergroups:read     # resolve @l2l3 / @server to their ids
      - users:read          # show who answered
      - files:write         # raw logs as a folded snippet in the alert's thread
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
